<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tin Tức - Invest X</title>
    {{header}}
    <style>
        /* Only scope news-specific elements, not header/footer */
        .news-page {
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .news-page > div {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .news-page {
            padding: 20px;
        }

        .news-page .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .news-page .header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .news-page .header h1 {
            font-size: 32px;
            color: #1a1a1a;
            margin-bottom: 10px;
        }

        .news-page .header p {
            color: #666;
            font-size: 14px;
        }

        .news-page .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .news-page .filter-btn {
            padding: 10px 20px;
            border: 2px solid #ddd;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .news-page .filter-btn.active {
            background: #2e7d32;
            color: white;
            border-color: #2e7d32;
        }

        .news-page .filter-btn:hover {
            border-color: #2e7d32;
        }

        .news-page .news-grid {
            display: grid !important;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)) !important;
            gap: 25px !important;
            margin-bottom: 40px !important;
        }

        .news-page .news-card {
            background: white !important;
            border-radius: 12px !important;
            overflow: hidden !important;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1) !important;
            transition: transform 0.3s, box-shadow 0.3s !important;
            cursor: pointer !important;
            display: flex !important;
            flex-direction: column !important;
            height: 100% !important;
        }

        .news-page .news-card:hover {
            transform: translateY(-5px) !important;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15) !important;
        }

        .news-page .news-card.featured {
            grid-column: auto !important;
        }

        @media (min-width: 768px) {
            .news-page .news-card.featured {
                grid-column: span 2 !important;
            }
        }

        .news-page .news-image {
            height: 180px !important;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%) !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            font-size: 60px !important;
            flex-shrink: 0 !important;
        }

        .news-page .news-card.featured .news-image {
            height: 250px !important;
            font-size: 80px !important;
        }

        .news-page .news-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: #ff9800;
            color: white;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .news-page .news-content {
            padding: 20px !important;
            display: flex !important;
            flex-direction: column !important;
            flex: 1 !important;
            background: white !important;
            min-height: 150px !important;
            overflow: visible !important;
            z-index: 10 !important;
        }

        .news-page .news-category {
            display: inline-block !important;
            background: #e8f5e9 !important;
            color: #2e7d32 !important;
            padding: 4px 10px !important;
            border-radius: 4px !important;
            font-size: 12px !important;
            font-weight: 600 !important;
            margin-bottom: 10px !important;
        }

        .news-page .news-title {
            font-size: 18px !important;
            font-weight: 700 !important;
            color: #1a1a1a !important;
            margin-bottom: 10px !important;
            line-height: 1.4 !important;
        }

        .news-page .news-card.featured .news-title {
            font-size: 22px;
        }

        .news-page .news-excerpt {
            color: #666 !important;
            font-size: 14px !important;
            line-height: 1.5 !important;
            margin-bottom: 15px !important;
            display: -webkit-box !important;
            -webkit-line-clamp: 2 !important;
            -webkit-box-orient: vertical !important;
            overflow: hidden !important;
        }

        .news-page .news-footer {
            display: flex !important;
            justify-content: space-between !important;
            align-items: center !important;
            font-size: 12px !important;
            color: #999 !important;
            padding-top: 15px !important;
            border-top: 1px solid #eee !important;
            margin-top: auto !important;
        }

        .news-page .news-meta {
            display: flex;
            gap: 15px;
        }

        .news-page .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .news-page .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .news-page .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 40px;
        }

        .news-page .pagination button {
            padding: 10px 15px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .news-page .pagination button.active {
            background: #2e7d32;
            color: white;
            border-color: #2e7d32;
        }

        .news-page .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .news-page .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .news-page .modal.open {
            display: flex;
        }

        .news-page .modal-content {
            background: white;
            border-radius: 12px;
            width: 90%;
            max-width: 800px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
        }

        .news-page .modal-close {
            float: right;
            font-size: 28px;
            cursor: pointer;
            color: #999;
        }

        .news-page .modal-close:hover {
            color: #1a1a1a;
        }

        .news-page .article-title {
            font-size: 28px;
            font-weight: 700;
            margin: 20px 0;
            color: #1a1a1a;
        }

        .news-page .article-meta {
            display: flex;
            gap: 20px;
            color: #666;
            font-size: 14px;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid #eee;
        }

        .news-page .article-content {
            font-size: 16px;
            line-height: 1.7;
            color: #333;
            white-space: pre-wrap;
        }

        @media (max-width: 768px) {
            .news-page .news-grid {
                grid-template-columns: 1fr;
            }

            .news-page .news-card.featured {
                grid-column: span 1;
            }

            .news-page .header h1 {
                font-size: 24px;
            }

            .news-page .modal-content {
                width: 95%;
                padding: 20px;
            }

            .news-page .article-title {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="news-page">

    <div class="container">
        <div class="header">
            <h1>📰 Tin Tức Thị Trường</h1>
            <p>Cập nhật thông tin mới nhất về giao dịch hàng hóa và chiến lược đầu tư</p>
        </div>

        <div class="filters" id="filters"></div>

        <div id="error" class="error" style="display: none;"></div>

        <div class="news-grid" id="newsList"></div>

        <div class="pagination" id="pagination"></div>

        <div class="modal" id="newsModal">
            <div class="modal-content">
                <span class="modal-close" onclick="closeModal()">&times;</span>
                <div id="modalBody"></div>
            </div>
        </div>
        </div>
    </div>

    {{footer}}

    <script type="module" src="/js/page-news.js"></script>
</body>
</html>
