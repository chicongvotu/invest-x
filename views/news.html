<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{var t=localStorage.getItem('sf-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>

<title>Tin Tức Thị Trường — SignalFlow</title>
<meta name="description" content="Cập nhật tin tức mới nhất về giao dịch hàng hóa, phân tích thị trường, mẹo giao dịch và chiến lược đầu tư.">
<meta name="robots" content="index, follow">

<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/components.css">

<style>
body { background: var(--bg-body, #0B0E11); }

/* Hero section */
.news-page .news-hero {
    margin-bottom: 32px;
    padding: 40px 0;
}

.news-page .news-hero h1 {
    font-size: 32px;
    font-weight: 700;
    color: var(--text-primary, #EAECEF);
    margin: 0 0 12px 0;
}

.news-page .news-hero p {
    font-size: 14px;
    color: var(--text-secondary, #848E9C);
    margin: 0;
    max-width: 600px;
}

/* Grid layout */
.news-page .news-grid-layout {
    display: grid;
    grid-template-columns: 260px 1fr 280px;
    gap: 24px;
    align-items: start;
}

.news-page .news-filters,
.news-page .news-featured {
    position: sticky;
    top: 100px;
}

@media (max-width: 1200px) {
    .news-page .news-grid-layout {
        grid-template-columns: 1fr;
    }
    .news-page .news-filters,
    .news-page .news-featured {
        position: static;
    }
}

.news-page .card-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border, #2B3139);
    margin-bottom: 20px;
}

.news-page .card-head h2 {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-primary, #EAECEF);
    margin: 0;
    letter-spacing: -0.3px;
}

.news-page .link-more {
    color: var(--text-secondary, #848E9C);
    text-decoration: none;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 4px;
}

.news-page .link-more:hover {
    color: var(--brand, #FCD535);
}

.news-page .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.news-page .featured-list {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.news-page .featured-item {
    padding: 14px;
    border-radius: 8px;
    background: var(--bg-elevated, #2B3139);
    border: 1px solid var(--border, #2B3139);
    cursor: pointer;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
}

.news-page .featured-item:hover {
    border-color: var(--brand, #FCD535);
    background: var(--bg-surface, #181A20);
    box-shadow: 0 4px 12px rgba(252, 213, 53, 0.1);
    transform: translateX(4px);
}

.news-page .featured-item-title {
    font-size: 13px;
    font-weight: 700;
    color: var(--text-primary, #EAECEF);
    margin-bottom: 6px;
    line-height: 1.4;
}

.news-page .featured-item-cat {
    font-size: 10px;
    color: var(--text-secondary, #848E9C);
    text-transform: uppercase;
    letter-spacing: 0.3px;
}

.news-page .filter-btn {
    padding: 12px 20px;
    border: 1px solid var(--border, #2B3139);
    background: transparent;
    border-radius: 10px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    color: var(--text-secondary, #848E9C);
    display: inline-flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
}

.news-page .filter-btn:hover {
    border-color: var(--brand, #FCD535);
    color: var(--text-primary, #EAECEF);
    background: rgba(252, 213, 53, 0.08);
}

.news-page .filter-btn.active {
    background: var(--brand, #FCD535);
    color: var(--brand-text, #0B0E11);
    border-color: var(--brand, #FCD535);
    font-weight: 600;
    box-shadow: 0 4px 12px rgba(252, 213, 53, 0.2);
}

.news-page .news-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
    gap: 20px;
}

.news-page .news-card {
    background: var(--bg-surface, #181A20);
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--border, #2B3139);
    display: flex;
    flex-direction: column;
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    cursor: pointer;
}

.news-page .news-card:hover {
    border-color: var(--brand, #FCD535);
    box-shadow: 0 8px 24px rgba(252, 213, 53, 0.15);
    transform: translateY(-4px);
}

.news-page .news-image {
    height: 200px;
    background: linear-gradient(135deg, var(--bg-elevated, #2B3139) 0%, var(--bg-surface, #181A20) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 72px;
    flex-shrink: 0;
    border-bottom: 1px solid var(--border, #2B3139);
    position: relative;
    transition: transform 0.3s ease;
}

.news-page .news-card:hover .news-image {
    transform: scale(1.05);
}

.news-page .news-badge {
    position: absolute;
    top: 12px;
    right: 12px;
    background: var(--brand, #FCD535);
    color: var(--brand-text, #0B0E11);
    padding: 5px 12px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 0.5px;
}

.news-page .news-content {
    padding: 16px;
    display: flex;
    flex-direction: column;
    flex: 1;
}

.news-page .news-category {
    font-size: 10px;
    color: var(--text-secondary, #848E9C);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    font-weight: 600;
    margin-bottom: 8px;
}

.news-page .news-title {
    font-size: 15px;
    font-weight: 700;
    color: var(--text-primary, #EAECEF);
    margin: 0 0 10px 0;
    line-height: 1.5;
}

.news-page .news-excerpt {
    font-size: 13px;
    color: var(--text-secondary, #848E9C);
    margin: 0 0 14px 0;
    line-height: 1.5;
    flex: 1;
}

.news-page .news-footer {
    border-top: 1px solid var(--border, #2B3139);
    padding-top: 12px;
    margin-top: auto;
}

.news-page .news-meta {
    display: flex;
    gap: 16px;
    font-size: 11px;
    color: var(--text-secondary, #848E9C);
}

.news-page .pagination {
    display: flex;
    justify-content: center;
    gap: 8px;
    margin-top: 24px;
}

.news-page .pagination button {
    padding: 8px 12px;
    border: 1px solid var(--border, #2B3139);
    background: transparent;
    border-radius: 4px;
    cursor: pointer;
    color: var(--text-secondary, #848E9C);
    font-size: 12px;
    transition: all 0.2s;
}

.news-page .pagination button.active {
    background: var(--brand, #FCD535);
    color: var(--brand-text, #0B0E11);
    border-color: var(--brand, #FCD535);
}

.news-page .pagination button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

.news-page .pagination button:hover:not(:disabled) {
    border-color: var(--brand, #FCD535);
}

.news-page .modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.7);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.news-page .modal.open {
    display: flex;
}

.news-page .modal-content {
    background: var(--bg-surface, #181A20);
    border-radius: 8px;
    width: 90%;
    max-width: 700px;
    max-height: 85vh;
    overflow-y: auto;
    padding: 24px;
    border: 1px solid var(--border, #2B3139);
}

.news-page .modal-close {
    float: right;
    font-size: 28px;
    cursor: pointer;
    color: var(--text-secondary, #848E9C);
    background: none;
    border: none;
    padding: 0;
    line-height: 1;
}

.news-page .modal-close:hover {
    color: var(--brand, #FCD535);
}

.news-page .article-title {
    font-size: 24px;
    font-weight: 700;
    margin: 16px 0 12px 0;
    color: var(--text-primary, #EAECEF);
    clear: both;
}

.news-page .article-meta {
    display: flex;
    gap: 16px;
    color: var(--text-secondary, #848E9C);
    font-size: 12px;
    margin-bottom: 16px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border, #2B3139);
}

.news-page .article-content {
    font-size: 14px;
    line-height: 1.6;
    color: var(--text-primary, #EAECEF);
    white-space: pre-wrap;
}

@media (max-width: 1200px) {
    .news-page .news-grid-layout {
        grid-template-columns: 1fr;
        gap: 20px;
    }
    .news-page .news-filters,
    .news-page .news-featured {
        position: static;
    }
}

@media (max-width: 768px) {
    .news-page .news-hero {
        padding: 24px 0;
        margin-bottom: 24px;
    }
    .news-page .news-hero h1 {
        font-size: 24px;
    }
    .news-page .news-hero p {
        font-size: 13px;
    }
    .news-page .news-grid {
        grid-template-columns: 1fr;
        gap: 16px;
    }
    .news-page .news-image {
        height: 160px;
        font-size: 56px;
    }
    .news-page .news-card {
        border-radius: 8px;
    }
    .news-page .modal-content {
        width: 95%;
        padding: 20px;
    }
    .news-page .article-title {
        font-size: 18px;
    }
}
</style>
</head>

<body data-auth-state="guest">

{{header}}

<main id="main">
<div class="container news-page">

    <!-- Hero Section -->
    <div class="news-hero">
        <h1>📰 Tin Tức Thị Trường</h1>
        <p>Cập nhật tin tức giao dịch, phân tích chuyên sâu và mẹo chiến lược từ cộng đồng trader</p>
    </div>

    <div class="news-grid-layout">
        <!-- Filters (left sidebar) -->
        <aside class="card news-filters">
            <div class="card-head">
                <h2>Danh mục</h2>
            </div>
            <div class="filters" id="filters"></div>
        </aside>

        <!-- Main news grid (center) -->
        <section>
            <div id="error" class="error" style="display: none;"></div>
            <div class="news-grid" id="newsList"></div>
            <div class="pagination" id="pagination"></div>
        </section>

        <!-- Featured articles (right sidebar) -->
        <aside class="card news-featured">
            <div class="card-head">
                <h2>Nổi bật</h2>
            </div>
            <div class="featured-list" id="featuredList"></div>
        </aside>
    </div>

    <!-- Article detail modal -->
    <div class="modal" id="newsModal">
        <div class="modal-content">
            <span class="modal-close" onclick="closeModal()">&times;</span>
            <div id="modalBody"></div>
        </div>
    </div>

</div>
</main>

{{footer}}

<script type="module" src="/js/layout.js"></script>
<script type="module" src="/js/page-news.js"></script>
</body>
</html>
