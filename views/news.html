<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{var t=localStorage.getItem('sf-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>

<title>Tin Tức Thị Trường — SignalFlow</title>
<meta name="description" content="Cập nhật tin tức mới nhất về giao dịch hàng hóa, phân tích thị trường, mẹo giao dịch và chiến lược đầu tư.">
<meta name="robots" content="index, follow">

<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/components.css">
</head>

<body data-auth-state="guest">

{{header}}

<main id="main">
    <style>
        /* Only scope news-specific elements, not header/footer */
        .news-page {
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
            background: var(--bg-body, #0B0E11) !important;
        }

        .news-page > div {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        .news-page {
            padding: 20px;
        }

        .news-page .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .news-grid-layout {
            display: grid !important;
            grid-template-columns: 280px 1fr 300px !important;
            gap: 20px !important;
            align-items: start !important;
        }

        .news-filters, .news-featured {
            position: sticky !important;
            top: 80px !important;
        }

        @media (max-width: 1200px) {
            .news-grid-layout {
                grid-template-columns: 1fr !important;
            }
            .news-filters, .news-featured {
                position: static !important;
            }
        }

        .news-page .card-head {
            display: flex !important;
            justify-content: space-between !important;
            align-items: center !important;
            padding-bottom: 12px !important;
            border-bottom: 1px solid var(--border, #2B3139) !important;
            margin-bottom: 16px !important;
        }

        .news-page .card-head h2 {
            font-size: 16px !important;
            font-weight: 600 !important;
            color: var(--text-primary, #EAECEF) !important;
            margin: 0 !important;
        }

        .link-more {
            color: var(--text-secondary, #848E9C) !important;
            text-decoration: none !important;
            font-size: 12px !important;
            display: flex !important;
            align-items: center !important;
            gap: 4px !important;
        }

        .link-more:hover {
            color: var(--brand, #FCD535) !important;
        }

        .featured-list {
            display: flex !important;
            flex-direction: column !important;
            gap: 12px !important;
        }

        .featured-item {
            padding: 10px !important;
            border-radius: 6px !important;
            background: var(--bg-elevated, #2B3139) !important;
            border: 1px solid var(--border, #2B3139) !important;
            cursor: pointer !important;
            transition: all 0.2s !important;
        }

        .featured-item:hover {
            border-color: var(--brand, #FCD535) !important;
        }

        .featured-item-title {
            font-size: 12px !important;
            font-weight: 600 !important;
            color: var(--text-primary, #EAECEF) !important;
            margin-bottom: 4px !important;
        }

        .featured-item-cat {
            font-size: 11px !important;
            color: var(--text-secondary, #848E9C) !important;
        }

        .news-page .header {
            background: var(--bg-surface, #181A20) !important;
            padding: 30px !important;
            border-radius: 12px !important;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3) !important;
            margin-bottom: 30px !important;
            border: 1px solid var(--border, #2B3139) !important;
        }

        .news-page .header h1 {
            font-size: 32px !important;
            color: var(--brand, #FCD535) !important;
            margin-bottom: 10px !important;
        }

        .news-page .header p {
            color: var(--text-secondary, #848E9C) !important;
            font-size: 14px !important;
        }

        .news-page .filters {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .news-page .filter-btn {
            padding: 10px 20px !important;
            border: 2px solid var(--border, #2B3139) !important;
            background: var(--bg-surface, #181A20) !important;
            border-radius: 8px !important;
            cursor: pointer !important;
            font-size: 14px !important;
            transition: all 0.3s !important;
            color: var(--text-secondary, #848E9C) !important;
        }

        .news-page .filter-btn.active {
            background: var(--brand, #FCD535) !important;
            color: var(--brand-text, #0B0E11) !important;
            border-color: var(--brand, #FCD535) !important;
        }

        .news-page .filter-btn:hover {
            border-color: var(--brand, #FCD535) !important;
        }

        .news-page .news-grid {
            display: grid !important;
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)) !important;
            gap: 25px !important;
            margin-bottom: 40px !important;
        }

        .news-page .news-card {
            background: var(--bg-surface, #181A20) !important;
            border-radius: 12px !important;
            overflow: hidden !important;
            box-shadow: 0 2px 8px rgba(0,0,0,0.3) !important;
            transition: transform 0.3s, box-shadow 0.3s !important;
            cursor: pointer !important;
            display: flex !important;
            flex-direction: column !important;
            height: 100% !important;
            border: 1px solid var(--border, #2B3139) !important;
        }

        .news-page .news-card:hover {
            transform: translateY(-5px) !important;
            box-shadow: 0 4px 16px rgba(0,0,0,0.15) !important;
        }

        .news-page .news-card.featured {
            grid-column: auto !important;
        }

        @media (min-width: 768px) {
            .news-page .news-card.featured {
                grid-column: span 2 !important;
            }
        }

        .news-page .news-image {
            height: 180px !important;
            background: var(--color-surface-secondary, #f5f5f5) !important;
            display: flex !important;
            align-items: center !important;
            justify-content: center !important;
            font-size: 60px !important;
            flex-shrink: 0 !important;
            border-bottom: 1px solid var(--color-border, #e0e0e0) !important;
        }

        .news-page .news-card.featured .news-image {
            height: 250px !important;
            font-size: 80px !important;
        }

        .news-page .news-badge {
            position: absolute !important;
            top: 15px !important;
            right: 15px !important;
            background: var(--brand, #FCD535) !important;
            color: var(--brand-text, #0B0E11) !important;
            padding: 6px 12px !important;
            border-radius: 20px !important;
            font-size: 12px !important;
            font-weight: 600 !important;
        }

        .news-page .news-content {
            padding: 20px !important;
            display: flex !important;
            flex-direction: column !important;
            flex: 1 !important;
            background: white !important;
            min-height: 150px !important;
            overflow: visible !important;
            z-index: 10 !important;
        }

        .news-page .news-category {
            display: inline-block !important;
            background: var(--color-success-light, #e8f5e9) !important;
            color: var(--color-success, #2e7d32) !important;
            padding: 6px 12px !important;
            border-radius: 4px !important;
            font-size: 12px !important;
            font-weight: 600 !important;
            margin-bottom: 10px !important;
        }

        .news-page .news-title {
            font-size: 18px !important;
            font-weight: 700 !important;
            color: var(--text-primary, #EAECEF) !important;
            margin-bottom: 10px !important;
            line-height: 1.4 !important;
        }

        .news-page .news-card.featured .news-title {
            font-size: 22px;
        }

        .news-page .news-excerpt {
            color: var(--text-secondary, #848E9C) !important;
            font-size: 14px !important;
            line-height: 1.5 !important;
            margin-bottom: 15px !important;
            display: -webkit-box !important;
            -webkit-line-clamp: 2 !important;
            -webkit-box-orient: vertical !important;
            overflow: hidden !important;
        }

        .news-page .news-footer {
            display: flex !important;
            justify-content: space-between !important;
            align-items: center !important;
            font-size: 12px !important;
            color: var(--text-secondary, #848E9C) !important;
            padding-top: 15px !important;
            border-top: 1px solid var(--border, #2B3139) !important;
            margin-top: auto !important;
        }

        .news-page .news-meta {
            display: flex !important;
            gap: 15px !important;
        }

        .news-page .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .news-page .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .news-page .pagination {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 40px;
        }

        .news-page .pagination button {
            padding: 10px 15px;
            border: 1px solid #ddd;
            background: white;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }

        .news-page .pagination button.active {
            background: #2e7d32;
            color: white;
            border-color: #2e7d32;
        }

        .news-page .pagination button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .news-page .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .news-page .modal.open {
            display: flex;
        }

        .news-page .modal-content {
            background: var(--bg-surface, #181A20) !important;
            border-radius: 12px !important;
            width: 90% !important;
            max-width: 800px !important;
            max-height: 90vh !important;
            overflow-y: auto !important;
            padding: 30px !important;
            border: 1px solid var(--border, #2B3139) !important;
        }

        .news-page .modal-close {
            float: right !important;
            font-size: 28px !important;
            cursor: pointer !important;
            color: var(--text-secondary, #848E9C) !important;
        }

        .news-page .modal-close:hover {
            color: var(--brand, #FCD535) !important;
        }

        .news-page .article-title {
            font-size: 28px !important;
            font-weight: 700 !important;
            margin: 20px 0 !important;
            color: var(--text-primary, #EAECEF) !important;
        }

        .news-page .article-meta {
            display: flex !important;
            gap: 20px !important;
            color: var(--text-secondary, #848E9C) !important;
            font-size: 14px !important;
            margin-bottom: 20px !important;
            padding-bottom: 20px !important;
            border-bottom: 1px solid var(--border, #2B3139) !important;
        }

        .news-page .article-content {
            font-size: 16px !important;
            line-height: 1.7 !important;
            color: var(--text-primary, #EAECEF) !important;
            white-space: pre-wrap !important;
        }

        @media (max-width: 768px) {
            .news-page .news-grid {
                grid-template-columns: 1fr;
            }

            .news-page .news-card.featured {
                grid-column: span 1;
            }

            .news-page .header h1 {
                font-size: 24px;
            }

            .news-page .modal-content {
                width: 95%;
                padding: 20px;
            }

            .news-page .article-title {
                font-size: 20px;
            }
        }
    </style>
</head>
<body>
    <div class="news-page">

    <div class="container">
        <div class="header">
            <h1>📰 Tin Tức Thị Trường</h1>
            <p>Cập nhật thông tin mới nhất về giao dịch hàng hóa và chiến lược đầu tư</p>
        </div>

        <div class="filters" id="filters"></div>

        <div id="error" class="error" style="display: none;"></div>

        <div class="news-grid" id="newsList"></div>

        <div class="pagination" id="pagination"></div>

        <div class="modal" id="newsModal">
            <div class="modal-content">
                <span class="modal-close" onclick="closeModal()">&times;</span>
                <div id="modalBody"></div>
            </div>
        </div>
        </div>
    </div>

</main>

{{footer}}

<script type="module" src="/js/layout.js"></script>
<script type="module" src="/js/page-news.js"></script>
</body>
</html>
