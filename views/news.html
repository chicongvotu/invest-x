<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{var t=localStorage.getItem('sf-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>

<title>Tin Tức Thị Trường — Invest X</title>
<meta name="description" content="Tin tức giao dịch, phân tích chuyên sâu, mẹo chiến lược từ Invest X.">
<meta name="robots" content="index, follow">

<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/components.css">

<style>
body { background: var(--bg-body, #0B0E11); }

/* Hero */
.news-hero {
    margin-bottom: 32px;
}

.news-hero h1 {
    font-size: 32px;
    font-weight: 700;
    color: var(--text-primary, #EAECEF);
    margin: 0 0 8px 0;
}

.news-hero p {
    font-size: 14px;
    color: var(--text-secondary, #848E9C);
    margin: 0;
}

/* Control Bar */
.news-controls {
    display: flex;
    gap: 16px;
    align-items: center;
    margin-bottom: 28px;
}

.time-filters {
    display: flex;
    gap: 10px;
}

.time-btn {
    padding: 10px 16px;
    border: 1px solid var(--border, #2B3139);
    background: transparent;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 500;
    color: var(--text-secondary, #848E9C);
    transition: all 0.3s;
}

.time-btn:hover {
    border-color: var(--brand, #FCD535);
    color: var(--text-primary, #EAECEF);
}

.time-btn.active {
    background: var(--brand, #FCD535);
    color: var(--brand-text, #0B0E11);
    border-color: var(--brand, #FCD535);
    font-weight: 600;
}

.search-input {
    flex: 1;
    max-width: 280px;
    padding: 10px 14px;
    border: 1px solid var(--border, #2B3139);
    background: transparent;
    border-radius: 8px;
    font-size: 13px;
    color: var(--text-primary, #EAECEF);
}

.search-input::placeholder {
    color: var(--text-secondary, #848E9C);
}

.search-input:focus {
    outline: none;
    border-color: var(--brand, #FCD535);
    box-shadow: 0 0 0 2px rgba(252, 213, 53, 0.1);
}

/* Main Layout: Sidebar + Grid */
.news-layout {
    display: flex;
    gap: 32px;
}

/* Sidebar */
.news-sidebar {
    width: 240px;
    flex-shrink: 0;
}

.filter-card {
    background: var(--bg-elevated, #2B3139);
    border: 1px solid var(--border, #2B3139);
    border-radius: 10px;
    overflow: hidden;
}

.filter-card h3 {
    font-size: 12px;
    font-weight: 700;
    color: var(--text-primary, #EAECEF);
    margin: 0;
    padding: 12px;
    border-bottom: 1px solid var(--border, #2B3139);
    text-transform: uppercase;
    letter-spacing: 0.5px;
}

.filter-list {
    padding: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
}

.filter-btn {
    padding: 10px 12px;
    border: 1px solid var(--border, #2B3139);
    background: transparent;
    border-radius: 6px;
    cursor: pointer;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-secondary, #848E9C);
    text-align: left;
    transition: all 0.2s;
}

.filter-btn:hover {
    border-color: var(--brand, #FCD535);
    color: var(--text-primary, #EAECEF);
}

.filter-btn.active {
    background: var(--brand, #FCD535);
    color: var(--brand-text, #0B0E11);
    border-color: var(--brand, #FCD535);
    font-weight: 600;
}

/* Main Content */
.news-main {
    flex: 1;
}

/* 3-Column Grid */
.news-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 20px;
    margin-bottom: 32px;
}

.news-card {
    background: var(--bg-surface, #181A20);
    border: 1px solid var(--border, #2B3139);
    border-radius: 10px;
    overflow: hidden;
    transition: all 0.3s;
    cursor: pointer;
    display: flex;
    flex-direction: column;
}

.news-card:hover {
    border-color: var(--brand, #FCD535);
    box-shadow: 0 12px 32px rgba(252, 213, 53, 0.15);
    transform: translateY(-4px);
}

.card-image {
    position: relative;
    height: 200px;
    background: linear-gradient(135deg, var(--bg-elevated, #2B3139) 0%, var(--bg-surface, #181A20) 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 72px;
    overflow: hidden;
}

.card-image::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, transparent 60%, rgba(0,0,0,0.5) 100%);
}

.card-badge {
    position: absolute;
    top: 10px;
    left: 10px;
    background: var(--bg-elevated, #2B3139);
    color: var(--brand, #FCD535);
    padding: 5px 10px;
    border-radius: 4px;
    font-size: 9px;
    font-weight: 700;
    text-transform: uppercase;
    z-index: 2;
}

.card-body {
    padding: 16px;
    display: flex;
    flex-direction: column;
    flex: 1;
}

.card-title {
    font-size: 14px;
    font-weight: 700;
    color: var(--text-primary, #EAECEF);
    margin: 0 0 10px 0;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.card-desc {
    font-size: 12px;
    color: var(--text-secondary, #848E9C);
    margin: 0 0 auto 0;
    line-height: 1.5;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
}

.card-footer {
    display: flex;
    justify-content: space-between;
    padding-top: 10px;
    margin-top: 10px;
    border-top: 1px solid var(--border, #2B3139);
    font-size: 10px;
    color: var(--text-secondary, #848E9C);
}

/* Pagination */
.news-pagination {
    display: flex;
    justify-content: center;
    gap: 6px;
    padding-top: 24px;
    border-top: 1px solid var(--border, #2B3139);
}

.pag-btn {
    width: 36px;
    height: 36px;
    border: 1px solid var(--border, #2B3139);
    background: transparent;
    border-radius: 6px;
    cursor: pointer;
    font-size: 13px;
    color: var(--text-secondary, #848E9C);
    transition: all 0.2s;
    display: flex;
    align-items: center;
    justify-content: center;
}

.pag-btn:hover:not(:disabled) {
    border-color: var(--brand, #FCD535);
    color: var(--text-primary, #EAECEF);
}

.pag-btn.active {
    background: var(--brand, #FCD535);
    color: var(--brand-text, #0B0E11);
    border-color: var(--brand, #FCD535);
    font-weight: 600;
}

.pag-btn:disabled {
    opacity: 0.5;
    cursor: not-allowed;
}

/* Modal */
.news-modal {
    display: none;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0,0,0,0.7);
    z-index: 1000;
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.news-modal.open {
    display: flex;
}

.modal-content {
    background: var(--bg-surface, #181A20);
    border-radius: 12px;
    width: 90%;
    max-width: 800px;
    max-height: 85vh;
    overflow-y: auto;
    padding: 32px;
    border: 1px solid var(--border, #2B3139);
}

.modal-close {
    float: right;
    font-size: 28px;
    cursor: pointer;
    color: var(--text-secondary, #848E9C);
    background: none;
    border: none;
    padding: 0;
    transition: color 0.2s;
}

.modal-close:hover {
    color: var(--brand, #FCD535);
}

.article-title {
    font-size: 28px;
    font-weight: 700;
    margin: 20px 0 16px 0;
    color: var(--text-primary, #EAECEF);
    clear: both;
}

.article-meta {
    display: flex;
    gap: 16px;
    font-size: 12px;
    color: var(--text-secondary, #848E9C);
    margin-bottom: 20px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border, #2B3139);
}

.article-content {
    font-size: 14px;
    line-height: 1.7;
    color: var(--text-primary, #EAECEF);
    white-space: pre-wrap;
}

/* Responsive */
@media (max-width: 1200px) {
    .news-grid {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 768px) {
    .news-layout {
        flex-direction: column;
        gap: 20px;
    }
    .news-sidebar {
        width: 100%;
    }
    .news-grid {
        grid-template-columns: 1fr;
    }
    .news-controls {
        flex-direction: column;
    }
    .search-input {
        max-width: 100%;
    }
}
</style>
</head>

<body data-auth-state="guest">

{{header}}

<main id="main">
<div class="container">
    <!-- Hero -->
    <div class="news-hero">
        <h1>Tin Tức Thị Trường</h1>
        <p>Cập nhật tin tức giao dịch, phân tích chuyên sâu, mẹo chiến lược từ Invest X</p>
    </div>

    <!-- Controls: Time filters + Search -->
    <div class="news-controls">
        <div class="time-filters" id="timeFilters"></div>
        <input type="text" id="searchInput" class="search-input" placeholder="Tìm kiếm tin tức...">
    </div>

    <!-- Layout: Sidebar + Main -->
    <div class="news-layout">
        <!-- Sidebar: Categories -->
        <aside class="news-sidebar">
            <div class="filter-card">
                <h3>Danh mục</h3>
                <div class="filter-list" id="filters"></div>
            </div>
        </aside>

        <!-- Main: Grid + Pagination -->
        <div class="news-main">
            <div class="news-grid" id="newsList"></div>
            <div class="news-pagination" id="pagination"></div>
        </div>
    </div>
</div>

<!-- Modal -->
<div class="news-modal" id="newsModal">
    <div class="modal-content">
        <span class="modal-close" onclick="closeModal()">&times;</span>
        <div id="modalBody"></div>
    </div>
</div>
</main>

{{footer}}

<script type="module" src="/js/layout.js"></script>
<script type="module" src="/js/page-news.js"></script>
</body>
</html>
