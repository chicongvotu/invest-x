<!DOCTYPE html>
<html lang="vi" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>try{var t=localStorage.getItem('sf-theme');if(t)document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>

<title>{{pageTitle}}</title>
<meta name="description" content="Tính năng này đang được xây dựng và sẽ có mặt trong bản cập nhật tới của SignalFlow.">
<!-- Trang chua co noi dung that thi khong cho Google index, tranh anh huong chat luong site -->
<meta name="robots" content="noindex, follow">

<link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="/css/tokens.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/components.css">
</head>

<body data-auth-state="guest">

{{header}}

<main id="main">
<div class="container">
    <section style="display:grid;place-items:center;min-height:56vh;text-align:center;padding:56px 0">
        <div style="max-width:520px">
            <div style="display:grid;place-items:center;width:64px;height:64px;margin:0 auto 20px;border-radius:var(--radius-lg);background:var(--brand-soft);color:var(--brand)">
                <i data-icon="clock" data-size="30"></i>
            </div>
            <h1 style="font-size:32px;margin-bottom:12px">{{heading}}</h1>
            <p class="muted" style="font-size:15px;margin-bottom:28px">{{message}}</p>
            <a href="/" class="btn btn-primary btn-lg">Về trang chủ</a>
        </div>
    </section>
</div>
</main>

{{footer}}

<script type="module" src="/js/layout.js"></script>
</body>
</html>
