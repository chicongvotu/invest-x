<!DOCTYPE html>
<html lang="vi">
<head>
    {{header}}
    <title>Quản Lý Tin Tức - Invest X</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f5f7fa;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .header h1 {
            font-size: 28px;
            color: #1a1a1a;
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            transition: all 0.3s;
        }

        .btn-primary {
            background: #2e7d32;
            color: white;
        }

        .btn-primary:hover {
            background: #1b5e20;
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #333;
            border: 1px solid #ddd;
        }

        .btn-secondary:hover {
            background: #eeeeee;
        }

        .btn-danger {
            background: #d32f2f;
            color: white;
        }

        .btn-danger:hover {
            background: #b71c1c;
        }

        .btn-small {
            padding: 8px 16px;
            font-size: 12px;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
            border-bottom: 2px solid #eee;
        }

        .tab-btn {
            padding: 12px 24px;
            border: none;
            background: none;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
            color: #666;
            border-bottom: 3px solid transparent;
            transition: all 0.3s;
            margin-bottom: -2px;
        }

        .tab-btn.active {
            color: #2e7d32;
            border-color: #2e7d32;
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-family: inherit;
            font-size: 14px;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .form-group input:focus,
        .form-group textarea:focus,
        .form-group select:focus {
            outline: none;
            border-color: #2e7d32;
            box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.1);
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-actions {
            display: flex;
            gap: 10px;
            margin-top: 30px;
        }

        .table {
            width: 100%;
            background: white;
            border-collapse: collapse;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .table th {
            background: #f5f5f5;
            padding: 15px;
            text-align: left;
            font-weight: 600;
            color: #666;
            border-bottom: 1px solid #ddd;
        }

        .table td {
            padding: 15px;
            border-bottom: 1px solid #eee;
        }

        .table tr:last-child td {
            border-bottom: none;
        }

        .table tr:hover {
            background: #fafafa;
        }

        .article-title {
            font-weight: 600;
            color: #1a1a1a;
            max-width: 400px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .article-actions {
            display: flex;
            gap: 10px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.open {
            display: flex;
        }

        .modal-content {
            background: white;
            border-radius: 12px;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
            padding: 30px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-close {
            font-size: 28px;
            cursor: pointer;
            color: #999;
            background: none;
            border: none;
        }

        .modal-close:hover {
            color: #1a1a1a;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: #999;
        }

        .empty-state-icon {
            font-size: 48px;
            margin-bottom: 20px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .success {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .checkbox {
            width: auto;
            margin-right: 10px;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                gap: 20px;
                text-align: center;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .table {
                font-size: 12px;
            }

            .table th,
            .table td {
                padding: 10px;
            }

            .article-actions {
                flex-direction: column;
            }

            .article-actions .btn {
                padding: 6px 12px;
                font-size: 11px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚙️ Quản Lý Tin Tức</h1>
            <button class="btn btn-primary" onclick="switchTab('create')">+ Thêm Bài Mới</button>
        </div>

        <div id="message"></div>

        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('create')">📝 Tạo Mới</button>
            <button class="tab-btn" onclick="switchTab('list')">📋 Danh Sách</button>
        </div>

        <!-- CREATE TAB -->
        <div id="create-tab" class="tab-content active">
            <div style="background: white; padding: 30px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1);">
                <h2 style="margin-bottom: 30px; color: #1a1a1a;">Tạo Bài Viết Mới</h2>

                <form id="createForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="title">Tiêu Đề</label>
                            <input type="text" id="title" placeholder="Nhập tiêu đề bài viết" required>
                        </div>
                        <div class="form-group">
                            <label for="category">Danh Mục</label>
                            <select id="category" required>
                                <option value="market">📊 Tin thị trường</option>
                                <option value="tips">💡 Mẹo giao dịch</option>
                                <option value="analysis">📈 Phân tích</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="excerpt">Tóm tắt</label>
                        <input type="text" id="excerpt" placeholder="Nhập tóm tắt bài viết (hiển thị trong danh sách)" required>
                    </div>

                    <div class="form-group">
                        <label for="content">Nội Dung Chi Tiết</label>
                        <textarea id="content" placeholder="Nhập nội dung đầy đủ" required></textarea>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="author">Tác Giả</label>
                            <input type="text" id="author" placeholder="Tên tác giả" required>
                        </div>
                        <div class="form-group">
                            <label for="image">Biểu Tượng Emoji</label>
                            <input type="text" id="image" placeholder="Chọn emoji (vd: 📊)" maxlength="2" required>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>
                            <input type="checkbox" class="checkbox" id="featured"> Bài Viết Nổi Bật
                        </label>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">💾 Lưu Bài Viết</button>
                        <button type="reset" class="btn btn-secondary">🔄 Xóa Nội Dung</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- LIST TAB -->
        <div id="list-tab" class="tab-content">
            <div id="articlesList"></div>
        </div>
    </div>

    <!-- EDIT MODAL -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>Chỉnh Sửa Bài Viết</h2>
                <button class="modal-close" onclick="closeEditModal()">&times;</button>
            </div>

            <form id="editForm">
                <input type="hidden" id="editId">

                <div class="form-row">
                    <div class="form-group">
                        <label for="editTitle">Tiêu Đề</label>
                        <input type="text" id="editTitle" required>
                    </div>
                    <div class="form-group">
                        <label for="editCategory">Danh Mục</label>
                        <select id="editCategory" required>
                            <option value="market">📊 Tin thị trường</option>
                            <option value="tips">💡 Mẹo giao dịch</option>
                            <option value="analysis">📈 Phân tích</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="editExcerpt">Tóm tắt</label>
                    <input type="text" id="editExcerpt" required>
                </div>

                <div class="form-group">
                    <label for="editContent">Nội Dung</label>
                    <textarea id="editContent" required></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="editAuthor">Tác Giả</label>
                        <input type="text" id="editAuthor" required>
                    </div>
                    <div class="form-group">
                        <label for="editImage">Biểu Tượng</label>
                        <input type="text" id="editImage" maxlength="2" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>
                        <input type="checkbox" class="checkbox" id="editFeatured"> Bài Viết Nổi Bật
                    </label>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">💾 Cập Nhật</button>
                    <button type="button" class="btn btn-secondary" onclick="closeEditModal()">Hủy</button>
                </div>
            </form>
        </div>
    </div>

    {{footer}}

    <script type="module" src="/js/page-admin-news.js"></script>
</body>
</html>
